<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Malla Curricular - Analista Programador</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #F7A8B8;
      --secondary: #A77EB3;
      --background: #FFF0F6;
      --card: #FFF6FA;
      --shadow: rgba(167, 126, 179, 0.12);
      --text-main: #8D4F74;
      --text-light: #BA7B9A;
      --checked: #f7a8b8cc;
      --checked-border: #A77EB3;
      --supervisado-bg: #e8f7fc;
      --supervisado-border: #80c4e0;
      --supervisado-text: #5393a2;
      --supervisado-checked-bg: #b5e3f3;
      --supervisado-checked-text: #397788;
    }

    body {
      margin: 0;
      background: var(--background);
      font-family: 'Montserrat', sans-serif;
      color: var(--text-main);
    }

    header {
      background: linear-gradient(120deg, #F7A8B8 60%, #A77EB3 100%);
      color: #fff;
      padding: 30px;
      text-align: center;
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
    }

    .login-bar {
      display: flex;
      justify-content: flex-end;
      padding: 10px 20px 0 0;
      gap: 10px;
    }

    .login-btn {
      background: var(--secondary);
      border: none;
      color: white;
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--secondary);
      font-weight: 600;
    }

    .user-info img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    .main-content-col {
      padding: 40px 0;
      display: flex;
      flex-direction: column;
      gap: 60px;
    }

    .year-title {
      font-size: 1.4rem;
      padding-left: 5vw;
      font-weight: bold;
      color: var(--secondary);
    }

    .bimestres-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      width: 95vw;
      margin: auto;
    }

    .bimestre-card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 2px 10px var(--shadow);
      border-left: 6px solid var(--primary);
    }

    .bimestre-title {
      font-weight: bold;
      margin-bottom: 12px;
      color: var(--secondary);
    }

    .subjects-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .subject {
      background: var(--background);
      border-radius: 8px;
      padding: 8px 12px;
      border: 1.5px solid #f7a8b8a1;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      position: relative;
    }

    .subject.checked {
      background: var(--checked);
      text-decoration: line-through;
      opacity: 0.8;
    }

    .subject-supervisado {
      background: var(--supervisado-bg);
      border-color: var(--supervisado-border);
      color: var(--supervisado-text);
    }

    .checkmark {
      margin-left: auto;
      display: none;
    }

    .subject.checked .checkmark {
      display: inline;
    }

    footer {
      text-align: center;
      margin: 40px 0;
      color: #c084a7;
    }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
</head>

<body>

<header>
  <h1><i class="fa-solid fa-graduation-cap"></i> Analista Programador</h1>
  <div class="login-bar" id="login-bar"></div>
</header>

<div class="main-content-col" id="malla-curricular"></div>

<footer>
  Hecho con ♥ | Firebase
</footer>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA4NX0spRyWrqq83Ys3Mxur2OD7eotg3n0",
    authDomain: "malla-curricular-39a2f.firebaseapp.com",
    projectId: "malla-curricular-39a2f",
    storageBucket: "malla-curricular-39a2f.appspot.com",
    messagingSenderId: "928134183214",
    appId: "1:928134183214:web:a7a72a792b1fc0f8e4e2bf"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();

  let usuarioActual = null;
  let estadoRamosCache = {};

  const malla = [
    {
      year: "Año 1",
      bimestres: [
        {
          nombre: "Bimestre 1",
          ramos: [
            { nombre: "Sistemas Operativos", icon: "fa-server" },
            { nombre: "Fundamentos de Programación", icon: "fa-code" }
          ]
        }
      ]
    }
  ];

  function renderLoginBar(user) {
    const bar = document.getElementById("login-bar");
    bar.innerHTML = "";
    if (user) {
      bar.innerHTML = `
        <span class="user-info">
          <img src="${user.photoURL}">
          ${user.displayName}
        </span>
        <button class="login-btn" onclick="auth.signOut()">Cerrar sesión</button>
      `;
    } else {
      const btn = document.createElement("button");
      btn.className = "login-btn";
      btn.innerHTML = `<i class="fa-brands fa-google"></i> Iniciar sesión`;
      btn.onclick = () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
      };
      bar.appendChild(btn);
    }
  }

  function getEstadoRamos() {
    return estadoRamosCache || {};
  }

  function setEstadoRamos(estado) {
    if (!usuarioActual) return;
    db.collection("ramos").doc(usuarioActual.uid).set({ estado });
  }

  function renderMalla() {
    const cont = document.getElementById("malla-curricular");
    cont.innerHTML = "";

    malla.forEach((anio, y) => {
      const year = document.createElement("div");
      year.innerHTML = `<div class="year-title">${anio.year}</div>`;

      const row = document.createElement("div");
      row.className = "bimestres-row";

      anio.bimestres.forEach((bim, b) => {
        const card = document.createElement("div");
        card.className = "bimestre-card";
        card.innerHTML = `<div class="bimestre-title">${bim.nombre}</div>`;

        const ul = document.createElement("ul");
        ul.className = "subjects-list";

        bim.ramos.forEach((ramo, r) => {
          const id = `${y}-${b}-${r}`;
          const data = estadoRamosCache[id];
          const checked = data?.aprobado;

          const li = document.createElement("li");
          li.className = "subject" + (checked ? " checked" : "");
          li.innerHTML = `
            <i class="fa-solid ${ramo.icon}"></i>
            ${ramo.nombre}
            <span class="checkmark"><i class="fa-solid fa-check-circle"></i></span>
            ${checked ? `<input type="number" min="1" max="7" step="0.1"
              value="${data.nota ?? ""}"
              style="margin-left:auto;width:55px;">` : ""}
          `;

          li.onclick = () => {
            if (!usuarioActual) return;
            const nuevo = { ...getEstadoRamos() };
            if (!checked) nuevo[id] = { aprobado: true, nota: "" };
            else delete nuevo[id];
            setEstadoRamos(nuevo);
          };

          li.onchange = e => {
            if (e.target.type === "number") {
              const nuevo = { ...getEstadoRamos() };
              nuevo[id].nota = parseFloat(e.target.value);
              setEstadoRamos(nuevo);
            }
          };

          ul.appendChild(li);
        });

        card.appendChild(ul);
        row.appendChild(card);
      });

      year.appendChild(row);
      cont.appendChild(year);
    });
  }

  auth.onAuthStateChanged(user => {
    usuarioActual = user;
    renderLoginBar(user);
    if (user) {
      db.collection("ramos").doc(user.uid).onSnapshot(doc => {
        estadoRamosCache = doc.exists ? doc.data().estado : {};
        renderMalla();
      });
    } else {
      estadoRamosCache = {};
      renderMalla();
    }
  });

  renderMalla();
</script>

</body>
</html>
